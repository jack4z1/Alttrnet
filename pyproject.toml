[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "alttrnet"
version = "0.1.0"
description = "Alttrnet — efficient coding-focused AI with system/model co-design"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

dependencies = [
    # Embedding & vector store
    "chromadb>=1.0",
    "ollama>=0.6",

    # Web extraction
    "trafilatura>=2.0",

    # Retrieval
    "rank-bm25>=0.2",

    # Reranking (cross-encoder)
    "sentence-transformers>=5.0",
    "torch>=2.0",

    # Configuration
    "pyyaml>=6.0",

    # Utilities
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core"]
